# ng-runner-policy: private-jit-only-v1
name: Validate One Click Apps
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' &&
      format('owner-pr:{0}:{1}:{2}:action:{3}:pool:{4}', inputs.pr_number, inputs.pr_sha, inputs.target_run_id, inputs.action_tag, inputs.runner_pool_tag) ||
      format('action:{0}:pool:{1}', inputs.action || inputs.action_tag || 'ci', inputs.runner_pool || inputs.runner_pool_tag || 'private') }}

on:
  pull_request_target:
    types:
    - labeled
    branches:
    - master
  workflow_dispatch:
    inputs:
      action_tag:
        description: Workflow action tag used by the private owner-PR dispatcher
        type: choice
        options:
        - ci
        required: false
        default: ci
      runner_pool_tag:
        description: Private JIT pool tag used by the owner-PR dispatcher
        type: choice
        options:
        - private
        required: false
        default: private
      pr_number:
        description: Trusted owner PR number set by the metadata-only dispatcher
        type: string
        required: false
      pr_sha:
        description: Exact trusted owner PR head SHA
        type: string
        required: false
      target_run_id:
        description: Metadata-only pull_request_target run ID
        type: string
        required: false
      pr_author:
        description: PR author copied from the metadata-only event
        type: string
        required: false
      pr_repository:
        description: PR head repository copied from the metadata-only event
        type: string
        required: false
permissions:
  contents: read

jobs:
  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: "github.event_name == 'workflow_dispatch' &&\n  github.ref == 'refs/heads/master' &&\n  inputs.action_tag == 'ci'\
      \ && inputs.runner_pool_tag == 'private' &&\n  ((github.actor == 'snapetech' && inputs.pr_number == '' && inputs.pr_sha\
      \ == '' && inputs.target_run_id == '' && inputs.pr_author == '' && inputs.pr_repository == '') ||\n   (github.actor\
      \ == 'github-actions[bot]' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && inputs.pr_author\
      \ == 'snapetech' && inputs.pr_repository == github.repository))\n  runs-on: ${{ fromJSON(format('{{\"group\":\"ng-shared-main-jit\"\
      ,\"labels\":[\"self-hosted\",\"linux\",\"x64\",\"ng-shared-main-one-click-apps\",\"ng-main-run-{0}\",\"gha-{0}-build\"\
      ]}}', github.run_id)) }}\n  steps:\n      - uses: actions/checkout@v7\n      - uses: actions/setup-node@v7\n       \
      \ with:\n            node-version: 20\n            cache: npm\n      - run: npm ci\n      - run: npm run validate_apps\n\
      \      - run: npm run formatter\n      - run: npm run build"
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-packer","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}',
      github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
    - name: Dispatch PR-head validation from master
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_SHA: ${{ github.event.pull_request.head.sha }}
        PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        TARGET_RUN_ID: ${{ github.run_id }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: "python3 - <<'PY'\nimport json\nimport os\nimport re\nfrom urllib.request import Request, urlopen\n\nrepository\
        \ = os.environ[\"GITHUB_REPOSITORY\"]\nnumber = os.environ[\"PR_NUMBER\"]\nsha = os.environ[\"PR_SHA\"]\npr_repository\
        \ = os.environ[\"PR_REPOSITORY\"]\npr_author = os.environ[\"PR_AUTHOR\"]\ntarget_run_id = os.environ[\"TARGET_RUN_ID\"\
        ]\ntoken = os.environ[\"GH_TOKEN\"]\nlabels = json.loads(os.environ[\"PR_LABELS_JSON\"])\naction_labels = [label for\
        \ label in labels if isinstance(label, str) and label.startswith(\"action:\")]\npool_labels = [label for label in\
        \ labels if isinstance(label, str) and label.startswith(\"pool:\")]\nif action_labels != [\"action:ci\"] or pool_labels\
        \ != [\"pool:private\"]:\n    raise SystemExit(\"add exactly action:ci and pool:private labels\")\nif repository !=\
        \ \"snapetech-org/one-click-apps\":\n    raise SystemExit(\"unexpected repository\")\nif pr_author != \"snapetech\"\
        \ or pr_repository.lower() != repository.lower():\n    raise SystemExit(\"private validation only accepts the repository\
        \ owner's pull requests\")\nif not re.fullmatch(r\"[1-9][0-9]*\", number):\n    raise SystemExit(\"invalid pull request\
        \ number\")\nif not re.fullmatch(r\"[0-9a-f]{40}\", sha):\n    raise SystemExit(\"invalid pull request head SHA\"\
        )\nif not re.fullmatch(r\"[1-9][0-9]*\", target_run_id):\n    raise SystemExit(\"invalid metadata run ID\")\n\npayload\
        \ = json.dumps({\n    \"ref\": \"master\",\n    \"inputs\": {\n        \"action_tag\": \"ci\",\n        \"runner_pool_tag\"\
        : \"private\",\n        \"pr_number\": number,\n        \"pr_sha\": sha,\n        \"target_run_id\": target_run_id,\n\
        \        \"pr_author\": pr_author,\n        \"pr_repository\": pr_repository,\n    },\n}).encode(\"utf-8\")\nrequest\
        \ = Request(\n    \"https://api.github.com/repos/snapetech-org/one-click-apps/actions/workflows/validate_apps.yml/dispatches\"\
        ,\n    data=payload,\n    headers={\n        \"Accept\": \"application/vnd.github+json\",\n        \"Authorization\"\
        : f\"Bearer {token}\",\n        \"Content-Type\": \"application/json\",\n        \"X-GitHub-Api-Version\": \"2022-11-28\"\
        ,\n    },\n    method=\"POST\",\n)\nwith urlopen(request, timeout=20) as response:\n    if response.status != 204:\n\
        \        raise SystemExit(f\"workflow dispatch returned HTTP {response.status}\")\nPY\n"
  build:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-one-click-apps","ng-main-run-{0}","gha-{0}-build"]}}',
      github.run_id)) }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: npm
    - run: npm ci
    - run: npm run validate_apps
    - run: npm run formatter
    - run: npm run build
    if: "github.event_name == 'workflow_dispatch' &&\n  github.ref == 'refs/heads/master' &&\n  inputs.action_tag == 'ci'\
      \ && inputs.runner_pool_tag == 'private' &&\n  ((github.actor == 'snapetech' && inputs.pr_number == '' && inputs.pr_sha\
      \ == '' && inputs.target_run_id == '' && inputs.pr_author == '' && inputs.pr_repository == '') ||\n   (github.actor\
      \ == 'github-actions[bot]' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && inputs.pr_author\
      \ == 'snapetech' && inputs.pr_repository == github.repository))"
  report-owner-pr-check:
    name: Report trusted owner PR validation
    needs:
    - build
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.pr_number != ''
      && inputs.pr_sha != '' && inputs.target_run_id != '' && inputs.pr_author == 'snapetech' && inputs.pr_repository == github.repository
      && inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' && github.actor == 'github-actions[bot]'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-one-click-apps","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}',
      github.run_id)) }}
    permissions:
      checks: write
      contents: none
    steps:
    - name: Attach validation result to the PR head
      env:
        GH_TOKEN: ${{ github.token }}
        PR_SHA: ${{ inputs.pr_sha }}
        VALIDATION_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') &&
          'cancelled' || 'success' }}
        VALIDATION_RUN_ID: ${{ github.run_id }}
      run: "python3 - <<'PY'\nimport json\nimport os\nimport re\nfrom urllib.request import Request, urlopen\n\nsha = os.environ[\"\
        PR_SHA\"]\nresult = os.environ[\"VALIDATION_RESULT\"]\nif not re.fullmatch(r\"[0-9a-f]{40}\", sha):\n    raise SystemExit(\"\
        invalid pull request head SHA\")\nconclusion = \"success\" if result == \"success\" else (\"cancelled\" if result\
        \ == \"cancelled\" else \"failure\")\nrun_id = os.environ[\"VALIDATION_RUN_ID\"]\npayload = json.dumps({\n    \"name\"\
        : \"One Click Apps validation owner PR\",\n    \"head_sha\": sha,\n    \"external_id\": run_id,\n    \"status\": \"\
        completed\",\n    \"conclusion\": conclusion,\n    \"details_url\": f\"https://github.com/snapetech-org/one-click-apps/actions/runs/{run_id}\"\
        ,\n    \"output\": {\n        \"title\": \"One Click Apps validation owner PR \" + conclusion,\n        \"summary\"\
        : \"See the linked default-branch-pinned workflow run for validation details.\",\n    },\n}).encode(\"utf-8\")\nrequest = Request(\n\
        \    \"https://api.github.com/repos/snapetech-org/one-click-apps/check-runs\",\n    data=payload,\n    headers={\n\
        \        \"Accept\": \"application/vnd.github+json\",\n        \"Authorization\": f\"Bearer {os.environ['GH_TOKEN']}\"\
        ,\n        \"Content-Type\": \"application/json\",\n        \"X-GitHub-Api-Version\": \"2022-11-28\",\n    },\n  \
        \  method=\"POST\",\n)\nwith urlopen(request, timeout=20) as response:\n    if response.status not in {201, 202}:\n\
        \        raise SystemExit(f\"check creation returned HTTP {response.status}\")\nPY\n"
