# ng-runner-policy: private-jit-only-v1
name: Validate One Click Apps

on:
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    build:
        runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-one-click-apps","ng-main-run-{0}","gha-{0}-build"]}}', github.run_id)) }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run validate_apps
            - run: npm run formatter
            - run: npm run build
