# ng-runner-policy: private-jit-only-v1
name: Publish One Click Apps
run-name: action:${{ inputs.action }}:pool:${{ inputs.runner_pool }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to perform
        type: choice
        options: [deploy]
        default: deploy
        required: true
      runner_pool:
        description: Required private runner pool
        type: choice
        options: [private]
        default: private
        required: true
permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    deploy:
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' && inputs.runner_pool == 'private' && github.ref == 'refs/heads/master'
        runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-one-click-apps","ng-main-run-{0}","gha-{0}-deploy"]}}', github.run_id)) }}

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run validate_apps
            - run: npm run formatter
            - run: npm run build
            - run: echo "caprover.com" > dist/index.html
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist
            - id: deployment
              uses: actions/deploy-pages@v5
